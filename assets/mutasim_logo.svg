<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- light airy background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3fbf7"/>
      <stop offset="0.55" stop-color="#e6f6ee"/>
      <stop offset="1" stop-color="#d7f0e4"/>
    </linearGradient>
    <!-- frosted glass fill -->
    <linearGradient id="glass" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fb183"/>
      <stop offset="1" stop-color="#0e8a5f"/>
    </linearGradient>
    <radialGradient id="ray" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- soft light rays from top -->
  <g opacity="0.55">
    <polygon points="512,120 300,60 724,60" fill="url(#ray)"/>
    <polygon points="512,120 180,230 180,20" fill="url(#ray)" opacity="0.5"/>
    <polygon points="512,120 844,230 844,20" fill="url(#ray)" opacity="0.5"/>
  </g>
  <circle cx="512" cy="300" r="240" fill="url(#ray)" opacity="0.7"/>

  <!-- emerald shield/book glyph -->
  <g transform="translate(512,392)">
    <!-- shield base -->
    <path d="M0,-210 C120,-170 210,-150 210,-150 L210,30 C210,160 110,250 0,300 C-110,250 -210,160 -210,30 L-210,-150 C-210,-150 -120,-170 0,-210 Z"
          fill="url(#emerald)" opacity="0.14"/>
    <!-- open book formed from two glass pages -->
    <path d="M-170,-70 C-120,-110 -30,-110 0,-78 L0,150 C-30,112 -120,112 -170,150 Z"
          fill="url(#glass)" stroke="#0e8a5f" stroke-opacity="0.35" stroke-width="5"/>
    <path d="M170,-70 C120,-110 30,-110 0,-78 L0,150 C30,112 120,112 170,150 Z"
          fill="url(#glass)" stroke="#0e8a5f" stroke-opacity="0.35" stroke-width="5"/>
    <!-- emerald spine + upward ray (growth / enlightenment) -->
    <rect x="-9" y="-92" width="18" height="246" rx="9" fill="url(#emerald)"/>
    <path d="M0,-96 L28,-176 L0,-150 L-28,-176 Z" fill="url(#emerald)"/>
    <!-- glass highlight edge -->
    <path d="M-150,-58 C-108,-92 -40,-92 -10,-70" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Arabic wordmark -->
  <text x="512" y="760" font-family="Cairo, 'Noto Kufi Arabic', sans-serif" font-size="210" font-weight="700" fill="#0e5c40" text-anchor="middle">معتصم</text>
  <text x="512" y="862" font-family="Cairo, 'Noto Kufi Arabic', sans-serif" font-size="70" font-weight="600" fill="#2fb183" text-anchor="middle">مدرسة المعتصم</text>
</svg>
